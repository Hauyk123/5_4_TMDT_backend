<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận thanh toán - Amazon AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #0F1111; }
        .navbar { background-color: #131921 !important; padding: 12px 0; }
        .custom-card { border: none; border-radius: 12px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .card-header-amazon { background: transparent; border-bottom: 2px solid #f0f2f5; padding: 15px 20px; }
        .price-text { color: #B12704; font-weight: 700; font-size: 1.1rem; }
        .btn-amazon { background-color: #febd69; border: none; color: #111; font-weight: 600; }
        .btn-amazon:hover { background-color: #f2a747; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container px-lg-5 text-center">
    <a class="navbar-brand fw-bold text-white fs-4 mx-auto" href="/">Amazon <span style="color: #febd69;">AI</span> Checkout</a>
  </div>
</nav>

<div class="container py-4" style="max-width: 1000px;">
    <form action="/place_order" method="POST">
        <div class="row g-4">
            <div class="col-md-8">
                <div class="custom-card mb-4">
                    <div class="card-header-amazon"><h5 class="mb-0 fw-bold">1. Địa chỉ giao hàng</h5></div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label fw-semibold">Tên người nhận</label><input type="text" class="form-control" name="receiver_name" required></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Số điện thoại</label><input type="text" class="form-control" name="phone" required></div>
                            <div class="col-12"><label class="form-label fw-semibold">Địa chỉ chi tiết</label><textarea class="form-control" name="shipping_address" rows="2" required></textarea></div>
                        </div>
                    </div>
                </div>

                <div class="custom-card">
                    <div class="card-header-amazon"><h5 class="mb-0 fw-bold">2. Phương thức thanh toán</h5></div>
                    <div class="card-body p-4">
                        <div class="form-check mb-3 p-3 border rounded bg-light">
                            <input class="form-check-input ms-1" type="radio" name="payment_method" value="cod" id="cod" checked>
                            <label class="form-check-label fw-bold ms-2" for="cod">Thanh toán khi nhận hàng (COD)</label>
                        </div>
                        <div class="form-check p-3 border rounded">
                            <input class="form-check-input ms-1" type="radio" name="payment_method" value="vnpay" id="vnpay">
                            <label class="form-check-label fw-bold text-primary ms-2" for="vnpay">Chuyển khoản / VNPay</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="custom-card p-4">
                    <button type="submit" class="btn btn-amazon w-100 btn-lg mb-3 shadow-sm">ĐẶT HÀNG</button>
                    <div class="small text-muted text-center border-bottom pb-3 mb-3">Bằng việc đặt hàng, bạn đồng ý với Điều khoản dịch vụ của Amazon AI.</div>

                    <h6 class="fw-bold mb-3">Tổng quan thanh toán</h6>
                    <div class="d-flex justify-content-between mb-2 small"><span>Tạm tính:</span><span>$120.00</span></div>
                    <div class="d-flex justify-content-between mb-2 small"><span>Phí vận chuyển:</span><span>$5.00</span></div>
                    <div class="d-flex justify-content-between fw-bold fs-5 mt-3 pt-3 border-top">
                        <span style="color: #B12704;">Tổng cộng:</span>
                        <span class="price-text">$125.00</span>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
